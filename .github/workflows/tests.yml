name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: iOS tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Check phone build queue
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          bash -n scripts/ship-to-phone.sh

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project OrcaBrowser.xcodeproj \
            -scheme OrcaBrowser \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/tests.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            build/tests.log
            build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 3
